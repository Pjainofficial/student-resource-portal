<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>

  <body>
    <div class="admin-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-logo">📚 Kanta's Sparsh Admin</div>

        <ul class="sidebar-menu">
          <li>
            <a href="dashboard.html"> Dashboard </a>
          </li>

          <li>
            <a href="topics.html"> Topics </a>
          </li>

          <li>
            <a href="subjects.html"> Subjects </a>
          </li>

          <li>
            <a href="resources.html"> Resources </a>
          </li>
        </ul>
        <div class="sidebar-footer">
          <a href="#" onclick="logout()" class="logout-link"> 🚪 Logout </a>
        </div>
      </aside>

      <!-- Main -->
      <main class="main-content">
        <h1>Dashboard</h1>

        <div class="stats-grid">
          <div class="stat-card">
            <h2 id="topicCount">0</h2>
            <p>Topics</p>
          </div>

          <div class="stat-card">
            <h2 id="subjectCount">0</h2>
            <p>Subjects</p>
          </div>

          <div class="stat-card">
            <h2 id="resourceCount">0</h2>
            <p>Resources</p>
          </div>
        </div>

        <div class="quick-actions">
          <a href="topics.html" class="action-btn"> + Add Topic </a>

          <a href="subjects.html" class="action-btn"> + Add Subject </a>

          <a href="resources.html" class="action-btn"> + Add Resource </a>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
