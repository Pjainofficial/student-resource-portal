<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Resources</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>

  <body>
    <div class="admin-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">📚 Kanta's Sparsh Admin</div>

        <ul class="sidebar-menu">
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="topics.html">Course</a></li>
          <li><a href="subjects.html">Subjects</a></li>
          <li><a href="resources.html">Resources</a></li>
        </ul>
        <div class="sidebar-footer">
          <a href="#" onclick="logout()" class="logout-link"> 🚪 Logout </a>
        </div>
      </aside>

      <main class="main-content">
        <h1>Manage Resources</h1>
        <div class="admin-form">
          <select id="topicSelect">
            <option value="">Select Course</option>
          </select>

          <select id="subjectSelect">
            <option value="">Select Subject</option>
          </select>

          <input type="number" id="resourceYear" placeholder="Year" />

          <input type="text" id="resourceTitle" placeholder="Resource Title" />
          <select id="resourceCategory">
            <option value="">Select Category</option>
            <option value="Book">📘 Book</option>
            <option value="Journal">📑 Journal</option>
            <option value="Research Paper">📄 Research Paper</option>
          </select>

          <input type="date" id="uploadDate" />
          <label>Cover Image(optional)</label>

          <input
            type="file"
            id="coverImage"
            placeholder="Cover page"
            accept="image/*"
          />

          <div class="form-group">
            <label>Origin</label>

            <select id="resourceOrigin">
              <option value="Indian">Indian</option>

              <option value="Foreign">🌍 Foreign</option>
            </select>
          </div>
          <select id="resourceType">
            <option value="pdf">PDF</option>
            <option value="link">External Link</option>
          </select>

          <input
            type="file"
            placeholder="Upload resource"
            id="pdfFile"
            accept=".pdf"
          />

          <input
            type="url"
            id="resourceUrl"
            placeholder="https://..."
            style="display: none"
          />

          <button id="saveResourceBtn" onclick="addResource()">
            Add Resource
          </button>
        </div>

        <hr />

        <div class="resource-toolbar">
          <input
            id="searchResource"
            placeholder="🔍 Search title, subject..."
            onkeyup="searchResources()"
          />

          <select id="filterCourse" onchange="filterResources()">
            <option value="">All Courses</option>
          </select>

          <select id="filterSubject" onchange="filterResources()">
            <option value="">All Subjects</option>
          </select>

          <select id="filterYear" onchange="filterResources()">
            <option value="">All Years</option>
          </select>

          <select id="filterCategory" onchange="filterResources()">
            <option value="">All Categories</option>
          </select>

          <select id="filterType" onchange="filterResources()">
            <option value="">All Types</option>
            <option value="pdf">PDF</option>
            <option value="link">Link</option>
          </select>
        </div>

        <div class="resource-summary">
          <span id="resourceCount">0 Resources</span>
        </div>

        <div id="resourcesList"></div>

        <div id="pagination"></div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/resources.js"></script>
  </body>
</html>
