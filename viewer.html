<!DOCTYPE html>
<html>
  <head>
    <title>PDF Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }

      iframe {
        width: 100%;
        height: 100vh;
        border: none;
      }
    </style>
  </head>
  <body>
    <iframe id="pdfFrame"></iframe>

    <script>
      const params = new URLSearchParams(window.location.search);

      const pdfUrl = params.get("pdf");

      document.getElementById("pdfFrame").src = pdfUrl;
    </script>
  </body>
</html>
