<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>College Portal Login</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>

  <body>
    <div class="auth-container">
      <div class="auth-card">
        <!-- COLLEGE LOGO -->
        <img
          id="loginCollegeLogo"
          src=""
          alt="College Logo"
          style="
            display: none;
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin: 0 auto 15px;
          "
        />

        <!-- COLLEGE NAME -->
        <h1 id="loginCollegeName">College Portal</h1>

        <!-- PORTAL TITLE -->
        <p id="loginPortalTitle">Secure Digital Library</p>

        <!-- USERNAME -->
        <input
          type="text"
          id="username"
          placeholder="College Username"
          autocomplete="username"
        />

        <!-- PASSWORD -->
        <input
          type="password"
          id="password"
          placeholder="Password"
          autocomplete="current-password"
        />

        <!-- LOGIN -->
        <button onclick="loginStudent()">Login to Portal</button>

        <p>Use the credentials provided by your administrator.</p>

        <p>
          <a href="admin/login.html"> Admin Login </a>
        </p>
      </div>
    </div>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CONFIG -->
    <script src="js/config.js"></script>

    <!-- STUDENT AUTH -->
    <script src="js/student-auth.js"></script>
  </body>
</html>
