<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Resources | E-Gyan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/resources.css" />
  </head>

  <body>
    <!-- NAVBAR -->

    <nav class="navbar">
      <div class="logo" id="collegeHeader">E-Gyan</div>

      <ul class="nav-links">
        <li>
          <a href="index.html"> 🏠 Home </a>
        </li>

        <li>
          <a href="javascript:history.back()"> ← Back </a>
        </li>
      </ul>
    </nav>

    <!-- SUBJECT HEADER -->

    <section class="resource-banner">
      <div class="resource-banner-content">
        <span class="banner-label"> 📖 Subject Resources </span>

        <h1 id="subjectTitle">Loading...</h1>

        <div class="subject-description-wrapper">
          <p id="subjectDescription">Loading subject description...</p>

          <button
            id="subjectDescriptionBtn"
            class="subject-description-btn"
            type="button"
            onclick="toggleSubjectDescription()"
            style="display: none"
          >
            Show more ↓
          </button>
        </div>
      </div>
    </section>

    <!-- RESOURCES -->

    <section class="section">
      <div id="resourcesContainer" class="resources-container">
        <div class="loading-card">Loading resources...</div>
      </div>
    </section>

    <!-- SCRIPTS -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>

    <script src="js/student-guard.js"></script>

    <script src="js/resources.js"></script>
  </body>
</html>
