<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Resources | E-Gyaan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/resources.css" />
  </head>

  <body>
    <!-- NAVBAR -->

    <nav class="navbar">
      <div class="logo" id="collegeHeader">E-Gyaan</div>

      <ul class="nav-links">
        <li>
          <a href="index.html"> 🏠 Home </a>
        </li>

        <li>
          <a href="javascript:history.back()"> ← Back </a>
        </li>
      </ul>
    </nav>

    <!-- SUBJECT HEADER -->

    <section class="resource-banner">
      <div class="resource-banner-content">
        <span class="banner-label"> 📖 Subject Resources </span>

        <h1 id="subjectTitle">Loading...</h1>

        <div class="subject-description-wrapper">
          <p id="subjectDescription">Loading subject description...</p>

          <button
            id="subjectDescriptionBtn"
            class="subject-description-btn"
            type="button"
            onclick="toggleSubjectDescription()"
            style="display: none"
          >
            Show more ↓
          </button>
        </div>
      </div>
    </section>

    <!-- RESOURCE FILTERS -->

    <section class="resource-filter-section">
      <div class="resource-filter-header">
        <div>
          <span class="filter-label"> 📚 RESOURCE LIBRARY </span>

          <h2>Find Your Resources</h2>

          <p>Search books, journals, PDFs and other academic resources.</p>
        </div>

        <button
          type="button"
          class="clear-filter-btn"
          onclick="resetResourceFilters()"
        >
          Clear Filters
        </button>
      </div>

      <div class="resource-filters">
        <div class="filter-search">
          <span>🔍</span>

          <input
            type="text"
            id="resourceSearch"
            placeholder="Search by resource name..."
            oninput="applyResourceFilters()"
          />
        </div>

        <div class="filter-control">
          <label for="resourceYearFilter"> 📅 Year </label>

          <select id="resourceYearFilter" onchange="applyResourceFilters()">
            <option value="all">All Years</option>
          </select>
        </div>

        <div class="filter-control">
          <label for="resourceTypeFilter"> 📄 Type </label>

          <select id="resourceTypeFilter" onchange="applyResourceFilters()">
            <option value="all">All Types</option>

            <option value="pdf">PDF</option>

            <option value="link">Link</option>
          </select>
        </div>

        <div class="filter-control">
          <label for="resourceCategoryFilter"> 📚 Category </label>

          <select id="resourceCategoryFilter" onchange="applyResourceFilters()">
            <option value="all">All Resources</option>
          </select>
        </div>

        <div class="filter-control">
          <label for="resourceSortFilter"> ↕ Sort </label>

          <select id="resourceSortFilter" onchange="applyResourceFilters()">
            <option value="newest">Newest First</option>

            <option value="oldest">Oldest First</option>
          </select>
        </div>
      </div>
    </section>

    <!-- RESOURCES -->

    <section class="section resource-list-section">
      <div id="resourcesContainer" class="resources-container">
        <div class="loading-card">Loading resources...</div>
      </div>
    </section>

    <!-- SCRIPTS -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>

    <script src="js/student-guard.js"></script>

    <script src="js/resources.js"></script>
  </body>
</html>
