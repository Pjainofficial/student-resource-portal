<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Resources | Kanta's Sparsh</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">Kanta's Sparsh</div>

      <ul class="nav-links">
        <li><a href="index.html">🏠 Home</a></li>

        <li><a href="javascript:history.back()">← Back</a></li>
      </ul>
    </nav>

    <!-- PAGE HEADER -->

    <section class="page-banner">
      <div class="page-banner-content">
        <h1 id="subjectTitle">Loading Subject...</h1>

        <p id="subjectDescription">
          Explore books, journals, lecture notes, previous year papers and
          learning resources organized by year.
        </p>
      </div>
    </section>

    <section class="section">
      <div class="resource-toolbar">
        <select id="yearFilter" onchange="filterResources()">
          <option value="">All Years</option>
        </select>
      </div>
      <div class="toolbar">
        <input
          id="searchResource"
          placeholder="🔍 Search Resources..."
          onkeyup="searchResources()"
        />

        <select id="yearFilter" onchange="filterResources()">
          <option value="">All Years</option>
        </select>

        <select id="sortFilter" onchange="applyFilters()">
          <option value="latest">Latest Upload</option>
          <option value="oldest">Oldest Upload</option>
          <option value="az">Title A-Z</option>
          <option value="za">Title Z-A</option>
        </select>
      </div>
      <div id="resourcesContainer">
        <div class="loading-card">Loading Resources...</div>
      </div>
    </section>

    <footer class="footer">
      <p>© 2026 Kanta's Sparsh Digital Knowledge Library</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>

    <script src="js/student-guard.js"></script>

    <script src="js/resources.js"></script>
  </body>
</html>
