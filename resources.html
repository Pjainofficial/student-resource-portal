<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Resources | E-Gyan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">E-Gyan</div>

      <ul class="nav-links">
        <li><a href="index.html">🏠 Home</a></li>

        <li><a href="javascript:history.back()">← Back</a></li>
      </ul>
    </nav>

    <!-- PAGE HEADER -->

    <section class="page-banner">
      <div class="page-banner-content">
        <h1 id="subjectTitle">Loading Subject...</h1>

        <p id="subjectDescription">
          Explore books, journals, lecture notes, previous year papers and
          learning resources organized by year.
        </p>
      </div>
    </section>

    <section class="section">
      <div class="resource-toolbar">

        <div class="resource-toolbar">
          <input
          id="searchResource"
          placeholder="🔍 Search by title, category, year..."
          onkeyup="applyFilters()"
        />
          <select id="yearFilter" onchange="applyFilters()">
            <option value="">📅 All Years</option>
          </select>
  
          <select id="categoryFilter" onchange="applyFilters()">
            <option value="">📚 All Categories</option>
          </select>

        
      
          <!-- NEW -->
          <select id="originFilter" onchange="applyFilters()">
            <option value="">🌍 All Origin</option>
            <option value="Indian">Indian</option>
            <option value="Foreign">🌎 Foreign</option>
          </select>
      
          <select id="typeFilter" onchange="applyFilters()">
            <option value="">📄 All Types</option>
            <option value="pdf">PDF</option>
            <option value="link">Link</option>
          </select>
      
          <select id="sortFilter" onchange="applyFilters()">
            <option value="latest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="az">Title A-Z</option>
            <option value="za">Title Z-A</option>
          </select>
      
      
      </div>

      <div class="resource-summary">
        <span id="resourceCount">0 Resources</span>
      </div>

      <!-- THIS WAS MISSING -->
      <div id="resourcesContainer">
        <div class="loading-card">Loading Resources...</div>
      </div>
    </section>

    <footer class="footer">
      <p>© 2026 E-Gyan Digital Knowledge Library</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>

    <script src="js/student-guard.js"></script>

    <script src="js/resources.js"></script>
  </body>
</html>
