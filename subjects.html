<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Subjects | E-Gyaan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/subjects.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="logo" id="collegeHeader">E-Gyaan</div>

      <ul class="nav-links">
        <li>
          <a href="index.html">🏠 Home</a>
        </li>

        <li>
          <a href="javascript:history.back()">← Back</a>
        </li>
      </ul>
    </nav>

    <!-- TOPIC HEADER -->
    <section class="page-banner">
      <div class="page-banner-content">
        <span class="banner-label"> 📚 Digital Knowledge Library </span>

        <h1 id="topicTitle">Loading...</h1>

        <div class="topic-description-wrapper">
          <p id="topicDescription">Loading topic description...</p>

          <button
            id="topicDescriptionBtn"
            class="topic-description-btn"
            type="button"
            onclick="toggleTopicDescription()"
            style="display: none"
          >
            Show more ↓
          </button>
        </div>
      </div>
    </section>

    <!-- SUBJECTS -->
    <section class="section">
      <div class="subject-toolbar">
        <input
          type="text"
          id="searchSubject"
          placeholder="🔍 Search Subjects..."
          onkeyup="filterSubjects()"
        />

        <select id="subjectDropdown" onchange="filterByDropdown()">
          <option value="">📚 Browse Subjects</option>
        </select>

        <span class="subject-total">
          <strong id="subjectCount">0</strong>
          Subjects
        </span>
      </div>

      <div id="subjectsGrid" class="subjects-grid">
        <div class="loading-card">Loading Subjects...</div>
      </div>

      <div id="pagination"></div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <p>© 2026 E-Gyaan Digital Knowledge Library</p>
    </footer>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>

    <script src="js/student-guard.js"></script>

    <script src="js/subjects.js"></script>
  </body>
</html>
