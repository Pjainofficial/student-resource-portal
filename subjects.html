<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subjects</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">📚 Kanta's Sparsh Library</div>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
      </ul>
    </nav>

    <section class="page-banner">
      <div class="page-banner-content">
        <h1 id="topicTitle">Loading...</h1>

        <p id="topicDescription">
          Browse all subjects available under this medical topic and continue
          your learning journey.
        </p>
      </div>
    </section>

    <section class="section">
      <div class="subject-toolbar">
        <input
          type="text"
          id="searchSubject"
          placeholder="🔍 Search subjects..."
          onkeyup="filterSubjects()"
        />

        <span id="subjectCount">0 Subjects</span>
      </div>

      <div id="subjectsGrid" class="subjects-grid">
        <div class="loading-card">Loading Subjects...</div>
      </div>

      <div id="pagination"></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>
    <script src="js/student-guard.js"></script>

    <script src="js/subjects.js"></script>
  </body>
</html>
